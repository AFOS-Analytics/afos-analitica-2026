name: Mirror dataset to Hugging Face

# Rotina diária LIGADA (1º run manual validado 05/Jun/2026). Encadeada via workflow_run:
# dispara na CONCLUSÃO do "Archive Analysis Snapshots" em vez de um cron independente
# às 14:10. Schedules do GitHub atrasam (best-effort), e o gap de 10min com o archive
# (14:00) era curto demais → em dias de atraso o mirror publicava sem o snapshot do dia
# (dataset público incompleto). Agora a ordem archive→mirror é garantida (EVAL 06/Jun).
# Também disparável manualmente.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Archive Analysis Snapshots"]
    types:
      - completed

concurrency:
  group: hf-dataset-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Só roda se o archive concluiu com sucesso (ou disparo manual). Evita espelhar
    # quando o upstream falhou.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout main (artefatos públicos + scripts)
        uses: actions/checkout@v4
        with:
          # histórico completo: build-hf-poll-results.mjs reconstrói as pesquisas
          # do log de public/polls-data.json (precisa de todos os commits)
          fetch-depth: 0

      - name: Checkout branch archive (série histórica de snapshots)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: archive
          path: archive-history

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (jszip — descompacta o ZIP do TSE)
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face CLI
        run: pip install -q -U "huggingface_hub[cli]"

      - name: Guard — export DEVE ser DB-free (anti-Lead/LGPD, não-negociável)
        run: |
          # Casa apenas CÓDIGO real (import/uso), não a prosa do comentário-salvaguarda
          # que cita "DATABASE_URL"/"Prisma" de propósito. Padrões precisos evitam falso-positivo.
          if grep -nE "@prisma/client|PrismaClient|process\.env\.DATABASE_URL|from ['\"][^'\"]*/db['\"]|require\(['\"][^'\"]*/db['\"]" scripts/export-hf-dataset.mjs; then
            echo "::error::export-hf-dataset.mjs referencia DB — viola a salvaguarda anti-Lead. Abortando."
            exit 1
          fi
          echo "✅ export-hf-dataset.mjs é DB-free."

      - name: Refresh national poll results (DB-free — só histórico git)
        # Reconstrói polls/national-poll-results-*.csv + national-polls.json das 22+
        # pesquisas nacionais a partir do log de polls-data.json. Sem DB, sem Lead.
        run: node scripts/build-hf-poll-results.mjs

      - name: Build enriched TSE registry + enrich the results polls (DB-free)
        # Baixa o TSE Dados Abertos e reconstrói polls/tse-registry.csv/json (350
        # presidenciais, TODOS os campos públicos sem truncar) + reaplica o bloco
        # tse_registration nas pesquisas com resultados (roda APÓS o passo acima,
        # senão a regeneração de national-polls.json apagaria o enriquecimento).
        run: node scripts/build-tse-registry-full.mjs

      - name: Build public export (DB-free — sem acesso a Lead)
        env:
          HF_HISTORY_DIR: archive-history
        run: node scripts/export-hf-dataset.mjs

      - name: Upload to Hugging Face dataset (cumulativo, sem --delete)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DATE=$(jq -r '.updatedAt // empty' public/analysis-criteriosa.json | grep -oE '^[0-9]{2}/[0-9]{2}/[0-9]{4}' || date -u +%d/%m/%Y)
          hf upload \
            AFOS-Analytics1/brazil-2026-electoral-divergence \
            .cache/hf-dataset . \
            --repo-type=dataset \
            --commit-message "daily mirror — ${DATE}"
