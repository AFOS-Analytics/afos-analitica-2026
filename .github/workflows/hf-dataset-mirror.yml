name: Mirror dataset to Hugging Face

# Rotina diária LIGADA (1º run manual validado 05/Jun/2026). Encadeada via workflow_run:
# dispara na CONCLUSÃO do "Archive Analysis Snapshots" em vez de um cron independente
# às 14:10. Schedules do GitHub atrasam (best-effort), e o gap de 10min com o archive
# (14:00) era curto demais → em dias de atraso o mirror publicava sem o snapshot do dia
# (dataset público incompleto). Agora a ordem archive→mirror é garantida (EVAL 06/Jun).
# Também disparável manualmente.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Archive Analysis Snapshots"]
    types:
      - completed

concurrency:
  group: hf-dataset-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Só roda se o archive concluiu com sucesso (ou disparo manual). Evita espelhar
    # quando o upstream falhou.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout main (artefatos públicos + scripts)
        uses: actions/checkout@v4
        with:
          # histórico completo: build-hf-poll-results.mjs reconstrói as pesquisas
          # do log de public/polls-data.json (precisa de todos os commits)
          fetch-depth: 0

      # ⛔ SEM `continue-on-error`. Ele existia de quando o archive era opcional.
      # Depois que a série de mercado do CSV passou a ser REGERADA a cada rodada,
      # archive ausente deixou de degradar o dataset e passou a TRUNCÁ-LO: a
      # publicação sobrescrevia a série completa por uma de um dia só.
      - name: Checkout branch archive (série histórica de snapshots)
        uses: actions/checkout@v4
        with:
          ref: archive
          path: archive-history

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (jszip — descompacta o ZIP do TSE)
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face CLI
        run: pip install -q -U "huggingface_hub[cli]"

      - name: Guard — export DEVE ser DB-free (anti-Lead/LGPD, não-negociável)
        run: |
          # Casa apenas CÓDIGO real (import/uso), não a prosa do comentário-salvaguarda
          # que cita "DATABASE_URL"/"Prisma" de propósito. Padrões precisos evitam falso-positivo.
          if grep -nE "@prisma/client|PrismaClient|process\.env\.DATABASE_URL|from ['\"][^'\"]*/db['\"]|require\(['\"][^'\"]*/db['\"]" scripts/export-hf-dataset.mjs; then
            echo "::error::export-hf-dataset.mjs referencia DB — viola a salvaguarda anti-Lead. Abortando."
            exit 1
          fi
          echo "✅ export-hf-dataset.mjs é DB-free."

      - name: Refresh national poll results (DB-free — só histórico git)
        # Reconstrói polls/national-poll-results-*.csv + national-polls.json das 22+
        # pesquisas nacionais a partir do log de polls-data.json. Sem DB, sem Lead.
        run: node scripts/build-hf-poll-results.mjs

      - name: Build enriched TSE registry + enrich the results polls (DB-free)
        # Baixa o TSE Dados Abertos e reconstrói polls/tse-registry.csv/json (350
        # presidenciais, TODOS os campos públicos sem truncar) + reaplica o bloco
        # tse_registration nas pesquisas com resultados (roda APÓS o passo acima,
        # senão a regeneração de national-polls.json apagaria o enriquecimento).
        run: node scripts/build-tse-registry-full.mjs

      - name: Remover CPF de pessoa física do registro do TSE (LGPD)
        # ⛔ BLOQUEANTE, e roda DEPOIS do passo acima de propósito: aquele passo
        # REGENERA o registro a partir do ZIP do TSE, então redigir antes seria
        # apagado a cada espelhamento.
        #
        # A salvaguarda anti-Lead do export é DB-free, ou seja, protege a tabela de
        # assinantes. Ela não olha o CONTEÚDO do que vem do TSE, e o TSE publica o
        # CPF do estatístico responsável dentro do texto livre de `methodology` e
        # `sampling_plan`. Público na origem não deixa de ser dado pessoal quando
        # republicado em massa. CNPJ de instituto FICA: identifica empresa, e é ele
        # que dá auditabilidade. Detectado em 04/Ago/2026, ERR-2026-002.
        run: |
          node scripts/redigir-cpf-tse-registry.mjs
          node scripts/redigir-cpf-tse-registry.mjs --check

      - name: Build public export (DB-free — sem acesso a Lead)
        env:
          HF_HISTORY_DIR: archive-history
        run: node scripts/export-hf-dataset.mjs

      - name: Enriquecimento poll-centric (datação midpoint + divergência por pesquisa + demografia A)
        # Roda APÓS o export (lê a série de mercado e o national-polls.json já no staging) e
        # enriquece o staging in-place: cada pesquisa ganha field_midpoint/days-to-election +
        # sample_design (camada A) e gera polls/sample-demographics.csv + data/poll-divergence.csv.
        # Defensivo (exit 0 em erro) — nunca quebra o mirror; pior caso = dia sem enriquecimento.
        env:
          POLLS_JSON: .cache/hf-dataset/polls/national-polls.json
          REGISTRY_JSON: .cache/hf-dataset/polls/tse-registry.json
          MARKET_CSV: .cache/hf-dataset/data/market-odds-timeseries.csv
          OUT_DIR: .cache/hf-dataset/polls
          DATA_DIR: .cache/hf-dataset/data
        run: node scripts/build-poll-enrichment.mjs

      - name: Upload to Hugging Face dataset (cumulativo, sem --delete)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DATE=$(jq -r '.updatedAt // empty' public/analysis-criteriosa.json | grep -oE '^[0-9]{2}/[0-9]{2}/[0-9]{4}' || date -u +%d/%m/%Y)
          hf upload \
            AFOS-Analytics1/brazil-2026-electoral-divergence \
            .cache/hf-dataset . \
            --repo-type=dataset \
            --commit-message "daily mirror — ${DATE}"

      - name: CHECKSUMS.txt (manifesto SHA-256 da arvore publicada)
        # ⚠️ RODA DEPOIS DO UPLOAD, e nao sobre o staging, de proposito. O staging
        # traz ~206 arquivos e o dataset publicado tem ~366: um manifesto feito
        # sobre o staging cobriria pouco mais da metade e daria impressao de
        # cobrir tudo. Num dataset VIVO, manifesto incompleto ou velho e pior que
        # manifesto ausente, porque quem confere o hash conclui que houve
        # adulteracao. Por isso ele e regerado a cada espelhamento.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf-mirror-brazil.py checksums
