name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on new commits to the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # fetch-depth 2 porque check-json-structure.ts compara contra o commit
        # anterior via git. Com o padrao de 1 commit ele nao tem contra o que
        # comparar, e a checagem passa sem checar.
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build with placeholder env vars — verifies the project compiles
      # without exposing secrets. Real values are set on Vercel.
      - name: Build (compile only)
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          KV_REST_API_URL: https://placeholder.upstash.io
          KV_REST_API_TOKEN: placeholder
          CRON_SECRET: placeholder
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Run AFOS Daily edge case tests
        run: npx --no-install tsx scripts/test-afos-daily-edge-cases.ts

      # scope.mjs é FONTE ÚNICA de 3 consumidores (cron, backfill do Neon, dataset
      # HF/Zaid). Regressão aqui apaga pesquisa do dashboard em silêncio.
      - name: Run TSE scope classifier tests
        run: npx --no-install tsx scripts/test-tse-scope.mjs

      # O conjunto de fantasmas responde QUAIS protocolos sairam do registro do
      # TSE, e desde 13/Set tambem se a retirada era NACIONAL com divulgacao a
      # frente, que e a unica pergunta que muda o que se publica. O teste cobre o
      # portao que NAO pode disparar (nacional ja vencida, estadual a frente) e o
      # medidor mudo (sem identidade, ele cala em vez de dizer "nenhuma").
      - name: Conjunto de fantasmas do TSE
        run: node scripts/testar-tse-fantasmas.mjs

      # O portao de ROTULO nacional. Em 17/Set/2026 uma falha de leitura saiu com
      # o codigo do GRAVE e a rodada anunciou rotulo grave sem medir nada; agora
      # NAO LEU sai 4, e REPROVADO exige codigo 1 E a linha do veredito. Os casos
      # de leitura usam arquivo local e 127.0.0.1, sem rede de fora.
      - name: Escopo derivado (rotulo nacional)
        run: node scripts/testar-escopo-derivado.mjs

      # A base de leitura dos scripts locais (AFOS_BASE). Lista fechada de hosts:
      # preview nunca passa por producao, e host estranho LANCA em vez de cair
      # calado no canonico. Sem rede.
      - name: Base de leitura e veredito de rede
        run: node scripts/testar-base-afos.mjs

      # A tabela de variacao do Brasil. Em 16/Set ela comparou contra 04/Set sem
      # aviso, porque a base era a ultima linha anotada; agora a base e a
      # certificada anterior livro a livro, e o ranking de volume por livro mede
      # a frase "o maior volume", que foi ao ar errada em 15/Set.
      - name: Tabela de variacao e ranking de volume (BR)
        run: node scripts/testar-deltas-brz.mjs

      # A rota /api/polls/tse para em 200 linhas e declara total igual ao que
      # serviu (14/Set: 351 na janela de 30d, 200 servidas), e o dia de HOJE nao
      # tinha bloco no relatorio. O teste cobre a borda do corte, o gatilho que
      # NAO pode disparar (estadual hoje, nacional amanha, fantasma) e o zero
      # sobre base cortada, que tem de sair INDETERMINADO.
      - name: Teto da API e gatilho do dia
        run: |
          node scripts/testar-tse-api-polls.mjs
          node scripts/testar-data-civil-brz.mjs
          node scripts/testar-saiu-hoje-brz.mjs

      # 18/Set/2026: a Veritá era a UNICA nacional divulgando no dia e o
      # news-cache tinha ZERO item sobre ela, em 12.680 titulos. Duas causas
      # empilhadas: a consulta `pesquisas` do coletor fazia AND de tres nomes
      # (12 itens contra 100 das outras), e o `\b` do JS nao ve fronteira
      # depois de "a" acentuado, entao /\bverit[aa]\b/ dava false em "Verita:".
      # O teste cobre o acento, o nome de registro que nao e o nome da imprensa
      # (TSE diz "100 Cidades", a imprensa diz "Futura/100% Cidades"), a sigla
      # curta e o portao que NAO pode disparar: divulgacao de hoje calada.
      # O de resolucao do Google News entra junto porque era orfao: nada no
      # repositorio o chamava, e o cabecalho dele mandava rodar com `node`,
      # que falha.
      - name: Cobertura de imprensa x indice nacional
        run: |
          node scripts/testar-cobertura-imprensa-brz.mjs
          npx --no-install tsx scripts/testar-resolver-google-news.mjs

      # 18/Set/2026: as duas regras que decidem se um campo e traduzido tinham
      # o mesmo efeito escondido, que e nunca virar PENDENCIA. A heranca vencia
      # o mapa, entao traducao errada uma vez publicada era herdada para sempre
      # e o --mapa nao a alcancava. E `name` era excluido por SUFIXO, regra
      # escrita para nome proprio de instituto, que pegava junto o rotulo
      # descritivo `scenarios[].name`: os 7 rotulos de cenario estavam em
      # PORTUGUES no polls-data.en.json publicado, em 30 de 30 pesquisas.
      # O teste trava as duas, e a mutacao que devolve a ordem antiga reprova 3.
      - name: Regras de traducao do painel BR
        run: node scripts/testar-traduzir-dashboard-brz.mjs

      # A regua por contrato do check:frescor, que em 13/Set ganhou o DONO
      # ESTRUTURAL: o preco citado dentro do cartao do candidato, onde o nome
      # nao se repete. O teste cobre os dois lados, o defeito real de 12/Set que
      # passou verde e os casos que NAO podem disparar (numero de urna, valor
      # historico, frase que nomeia dois livros).
      - name: Regua por contrato do frescor
        run: node scripts/testar-frescor-contratos.mjs

      # Os medidores do generic ballot dos EUA. Ate 13/Set nenhum teste dos EUA
      # rodava aqui, embora os cinco sejam puros: sem rede, sem banco e sem
      # relogio. O de agregadores entrou no mesmo dia, e cobre o medidor que NAO
      # pode dizer "em compasso" sem ter enxergado a tabela.
      - name: Medidores do generic ballot (EUA)
        run: |
          node scripts/testar-agregadores-us.mjs
          node scripts/testar-defasagem-us.mjs
          node scripts/testar-atribuicao-us.mjs
          node scripts/testar-ruido-da-janela-us.mjs
          node scripts/testar-congelamento-do-campo-us.mjs
          node scripts/testar-agregador-na-fonte-us.mjs
          node scripts/testar-historico-us-polls.mjs
          node scripts/testar-rodadas-curadas.mjs
          node scripts/testar-data-corrente-imprensa.mjs
          node scripts/testar-instrumento-us.mjs
          node scripts/testar-instrumento-medido.mjs
          node scripts/testar-soma-conferida.mjs
          node scripts/testar-casas-us.mjs
          node scripts/testar-leaner-us.mjs
          npx --no-install tsx scripts/testar-estado-do-portao.ts
          npx --no-install tsx scripts/testar-mercados-us.ts
          python3 scripts/testar-hf-upload-us2026.py

      # A trava que decide se o backup vai a um repositorio PUBLICO. Ate
      # 20/Set/2026 ela vivia inline no check-backup-sem-pii.ts, sem um unico
      # caso, e o unico sinal de que tinha errado era o workflow do backup
      # falhar no dia seguinte. Foi assim que se descobriu que ela lia NOME DE
      # ARQUIVO de documento publico como token, e um dia de backup se perdeu.
      - name: Segredo x nome publico (trava do backup)
        run: node scripts/testar-parece-segredo.mjs

      # A regra que decide se um superlativo pode ser escrito, e o par binario
      # cru e normalizado, nos dois paises. Puro, sem rede nem backup. Ficou
      # fora do CI ate 15/Set, quando ganhou a escolha da certificada ANTERIOR.
      - name: Serie dos contratos e par binario
        run: node scripts/testar-serie-contrato.mjs

      # Os portoes de CONTEUDO viviam so em .git/hooks/pre-commit, que NAO e
      # versionado: clone novo, maquina nova ou commit com --no-verify passavam
      # sem nenhum deles, e o CI nao repetia um so. Aqui rodam sem a condicao de
      # arquivo staged, porque no CI o recorte e o push inteiro.
      - name: Schema canonico de polls-data
        run: npx --no-install tsx scripts/validate-polls-data.ts

      - name: Estrutura dos JSONs contra o commit anterior
        # --all e OBRIGATORIO no CI: sem argumento o script olha os arquivos
        # STAGED, e no CI nao ha staging, entao ele imprimiria "nada a fazer" e
        # passaria verde sem conferir nada, que e coverage de mentira.
        run: npx --no-install tsx scripts/check-json-structure.ts --all

      - name: Prosa em portugues dentro de componente
        run: npx --no-install tsx scripts/check-hardcoded-ptbr.ts

      - name: Gate numerico da traducao
        run: npx --no-install tsx scripts/test-json-number-gate.ts

      - name: Paridade dos JSONs de idioma
        run: npx --no-install tsx scripts/check-locale-json.ts

  # A suite Playwright NAO roda no CI, e a decisao e de 19/Ago/2026, tomada
  # depois de liga-la e ver o resultado: 7 dos 11 casos falharam.
  #
  # A causa nao e defeito dos testes, e o AMBIENTE. O job sobe com DATABASE_URL
  # de placeholder e sem Upstash, entao /api/translations devolve 503 em vez do
  # 401 que o caso afirma, e as paginas de painel nao renderizam o conteudo que
  # os seletores procuram. Rodar a suite aqui exigiria banco e cache de verdade
  # no CI, que e outra decisao, com custo proprio, e nao e minha de tomar.
  #
  # NAO se resolve com `continue-on-error`: job que falha e e ignorado e
  # exatamente a coverage de mentira que esta auditoria removeu de outro lugar
  # no mesmo dia. Ou o portao vale, ou nao esta aqui.
  #
  # O que ficou consertado na suite e vale de qualquer forma: as duas assercoes
  # obsoletas, que procuravam strings inexistentes; o caso de /api/subscribe,
  # que passava verde SEM ASSERCAO NENHUMA e escrevia Lead de verdade na base a
  # cada execucao; e o idioma fixo no playwright.config.ts, sem o qual o
  # Chromium anuncia en-US e derruba os casos de rota em pt-BR.
  #
  # Roda com `npm run test:e2e` contra um ambiente com servicos.
