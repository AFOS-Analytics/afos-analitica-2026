name: Refresh TSE poll registry

# Atualiza o artefato ESTÁTICO hf-assets/polls/tse-registry.{csv,json} (382+ registros
# oficiais do TSE) a partir do banco (tabela researchFinding) e commita de volta na main.
# Quem PUBLICA no HF é o mirror DB-free ("Mirror dataset to Hugging Face"), que copia este
# artefato já commitado — assim a credencial de banco NUNCA entra no pipeline público.
#
# ⚠️ Isolamento anti-Lead: este workflow tem DATABASE_URL e PODE alcançar o banco, mas
# (a) build-hf-tse-registry.mjs consulta SOMENTE researchFinding (metadado público de
# pesquisa, sem PII/Lead) e (b) ele NÃO faz upload externo — só gera CSV/JSON e commita.
# O mirror público segue DB-free. Registro muda devagar → cadência semanal.
# ⛔ AGENDAMENTO DESLIGADO em 16/Set/2026, por decisão do André. NÃO religar.
#
# Este job roda build-hf-tse-registry.mjs, que lê o NOSSO banco: gera o registro
# com 14 colunas e inclui as pesquisas que o TSE já RETIROU do arquivo oficial
# (84 em 16/Set). O registro publicado em hf-assets/polls/tse-registry.* vem, desde
# 10/Set, de build-tse-registry-full.mjs, que lê o arquivo PÚBLICO do TSE, com 22
# colunas, via `npm run espelho:brz` rodado de rede residencial.
#
# 🔴 Ele falhou nas 4 segundas de 24/Ago a 14/Set (WebSocket do Neon no Node 20),
# e foi SÓ essa falha que manteve o registro publicado íntegro: consertar a conexão
# faria o arquivo regredir na execução seguinte. E o produtor certo não pode rodar
# aqui, porque o TSE devolve 403 à rede do GitHub.
# → memory/project_state_16set_usa.md · memory/project_state_10set_brz_hf.md
#
# O workflow_dispatch fica apenas para inspeção manual consciente, e o workflow
# também foi desabilitado no GitHub (gh workflow disable).
on:
  workflow_dispatch:

concurrency:
  group: refresh-tse-registry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (postinstall roda prisma generate)
        run: npm ci

      - name: Gerar registro TSE do banco (só researchFinding — sem Lead)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: node scripts/build-hf-tse-registry.mjs

      - name: Commitar artefato se mudou
        run: |
          git config user.name "afos-ci"
          git config user.email "ci@afos-analytics.com"
          git add hf-assets/polls/tse-registry.csv hf-assets/polls/tse-registry.json
          if git diff --cached --quiet; then
            echo "registro TSE inalterado — nada a commitar"
          else
            git commit -m "chore: refresh TSE poll registry artifact (weekly)"
            git push
          fi
